<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Homework Hub — Earn Points, Beat Your Friends</title>
<style>@import url("/style.css")</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span> Homework Hub</div>
  <div class="user-area">
    <input id="userInput" placeholder="Your name…" autocomplete="off" maxlength="18" />
    <span class="points-pill">⭐ <span id="myPoints">0</span> pts</span>
  </div>
</header>

<main class="layout">
  <!-- Homework list -->
  <section class="panel">
    <div class="panel-head">
      <h2>📋 Homework</h2>
      <span class="subtitle">Sorted by subject → due date</span>
    </div>
    <div id="homeworkList"></div>
  </section>

  <!-- Leaderboard -->
  <aside class="panel">
    <div class="panel-head">
      <h2>🏆 Leaderboard</h2>
      <span class="subtitle" id="monthLabel"></span>
    </div>

    <div class="reset-box">
      <div class="label">Resets in</div>
      <div class="countdown" id="countdown">—</div>
      <div class="reset-date" id="resetDate"></div>
    </div>

    <ol class="leaderboard" id="leaderboard"></ol>
  </aside>
</main>

<button class="fab" id="fab" title="Add homework" aria-label="Add homework">+</button>

<!-- Add homework modal -->
<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Add homework</h2>
    <form id="addForm">
      <label class="field">
        <span>Subject</span>
        <input id="subjectInput" list="subjectList" placeholder="e.g. Math" required maxlength="30" autocomplete="off" />
        <datalist id="subjectList">
          <option>Math</option><option>English</option><option>Science</option>
          <option>Biology</option><option>Chemistry</option><option>Physics</option>
          <option>History</option><option>Geography</option><option>Computer Science</option>
          <option>Art</option><option>Music</option><option>PE</option>
          <option>Language</option><option>Other</option>
        </datalist>
      </label>

      <label class="field">
        <span>Task</span>
        <input id="titleInput" placeholder="e.g. Page 42, exercises 1–10" required maxlength="90" autocomplete="off" />
      </label>

      <label class="field">
        <span>Due date</span>
        <input id="dueInput" type="date" required />
      </label>

      <p class="reward">🎉 +20 points for adding homework</p>

      <div class="modal-actions">
        <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn primary">Add homework</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/script.js"></script>
</body>
</html>
